name: Apply V32 RC1

on:
  push:
    branches:
      - v32-sprint-1
    paths:
      - 'scripts/apply-v32-rc1-app.mjs'
      - '.github/workflows/apply-v32-rc1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v32-sprint-1
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-v32-rc1-app.mjs
      - run: npm install
      - run: npm run build
      - name: Commit RC1 changes
        run: |
          git config user.name "ChatGPT Codex Connector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx public/sw.js
          git diff --cached --quiet || git commit -m "V32.0 RC1 - Finalise la phase 1"
          git push origin v32-sprint-1
