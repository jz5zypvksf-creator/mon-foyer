name: Refresh Beobank lockfile
on:
  push:
    branches: [v32-rc2-4-6]
    paths:
      - '.github/workflows/update-lock-beobank.yml'
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v32-rc2-4-6
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "RC2.4.6: update lockfile for Beobank PDF import"
          git push origin HEAD:v32-rc2-4-6
