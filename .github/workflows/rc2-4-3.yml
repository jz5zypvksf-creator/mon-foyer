name: RC2.4.3 regroupement empreintes Belfius

on:
  push:
    branches:
      - v32-rc2-4-3
    paths:
      - scripts/apply-rc2-4-3.mjs
      - .github/workflows/rc2-4-3.yml

permissions:
  contents: write

jobs:
  apply-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v32-rc2-4-3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/apply-rc2-4-3.mjs
      - run: npm install
      - run: npm run build
      - name: Commit RC2.4.3
        run: |
          git config user.name "ChatGPT Codex Connector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/BelfiusAudit.jsx
          if git diff --cached --quiet; then
            echo "Aucun changement à committer"
          else
            git commit -m "V32 RC2.4.3 - Regroupement par empreintes Belfius"
            git push origin v32-rc2-4-3
          fi
