name: RC2.4.6 savings baseline fix

on:
  push:
    branches:
      - v32-rc2-4-6
    paths:
      - .github/workflows/rc246-savings-baseline-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v32-rc2-4-6
      - name: Patch savings import baseline logic
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('src/App.jsx')
          s = p.read_text()
          old = """    let applied = {};
              try { applied = JSON.parse(localStorage.getItem(APPLIED_SAVINGS_STORAGE_KEY) || '{}'); } catch { applied = {}; }
              const freshTransfers = transfers.filter((transfer) => !applied[transfer.fingerprint]);
              if (!freshTransfers.length) return;
          """
          new = """    let applied = {};
              try { applied = JSON.parse(localStorage.getItem(APPLIED_SAVINGS_STORAGE_KEY) || '{}'); } catch { applied = {}; }

              // RC2.4.6 : le CSV Belfius identifie les transferts, mais ne connait pas le solde reel
              // du compte d'epargne externe (ex. Beobank). Au premier releve observe, on etablit
              // uniquement une ligne de base : l'historique est memorise sans modifier le solde.
              if (Object.keys(applied).length === 0) {
                transfers.forEach((transfer) => {
                  applied[transfer.fingerprint] = {
                    bucket: transfer.bucket,
                    amount: transfer.amount,
                    appliedAt: new Date().toISOString(),
                    source: auditMeta.fileName || 'Belfius CSV',
                    baseline: true,
                  };
                });
                localStorage.setItem(APPLIED_SAVINGS_STORAGE_KEY, JSON.stringify(applied));
                return;
              }

              const freshTransfers = transfers.filter((transfer) => !applied[transfer.fingerprint]);
              if (!freshTransfers.length) return;
          """
          # Ignore indentation differences by using the exact source block if needed.
          if old not in s:
              old = """    let applied = {};
              try { applied = JSON.parse(localStorage.getItem(APPLIED_SAVINGS_STORAGE_KEY) || '{}'); } catch { applied = {}; }
              const freshTransfers = transfers.filter((transfer) => !applied[transfer.fingerprint]);
              if (!freshTransfers.length) return;
          """.replace('              ', '    ')
              new = new.replace('              ', '    ')
          if old not in s:
              raise SystemExit('Target block not found; refusing unsafe patch')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "RC2.4.6: establish savings CSV baseline before increments"
          git push origin HEAD:v32-rc2-4-6
