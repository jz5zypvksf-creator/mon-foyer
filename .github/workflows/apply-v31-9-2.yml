name: Apply V31.9.2

on:
  push:
    paths:
      - 'scripts/apply-v31-9-2-remove-belfius-floating.mjs'
      - '.github/workflows/apply-v31-9-2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-v31-9-2-remove-belfius-floating.mjs
      - run: npm install
      - run: npm run build
      - name: Commit changes
        run: |
          git config user.name "ChatGPT Codex Connector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx public/sw.js
          git diff --cached --quiet || git commit -m "V31.9.2 - Supprime définitivement le bouton flottant Belfius"
          git push

# Correctif relancé après vérification sur ordinateur.
