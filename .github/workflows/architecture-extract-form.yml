name: Verify architecture extract form
on:
  push:
    branches: [architecture/extract-form]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: architecture/extract-form
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply QA regression fixes
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';

          const appPath = 'src/App.jsx';
          let app = fs.readFileSync(appPath, 'utf8');

          const replaceOrVerify = (source, before, after, marker) => {
            if (source.includes(before)) return source.replace(before, after);
            if (source.includes(marker || after)) return source;
            throw new Error(`Patch anchor missing: ${marker || before.slice(0, 80)}`);
          };

          app = replaceOrVerify(
            app,
            `    // L'Historique est le registre des écritures sauvegardées pour le mois choisi.\n    // Une écriture future reste visible et est distinguée comme « Prévue » dans la liste.\n    return monthOperations.filter((operation) => {`,
            `    // Pour le mois en cours, l'historique ne reprend que les écritures arrivées à échéance.\n    // Les écritures futures restent disponibles dans les vues prévisionnelles, pas dans l'historique réalisé.\n    return monthOperations.filter((operation) => {\n      if (selectedMonth === today.slice(0, 7) && operation.date > today) return false;`,
            `if (selectedMonth === today.slice(0, 7) && operation.date > today) return false;`,
          );

          app = replaceOrVerify(
            app,
            `  }, [data.categories, historyCategory, historyPaymentMethod, historyPerson, historySearch, historyType, monthOperations, reviewMap, showReviewOnly]);`,
            `  }, [data.categories, historyCategory, historyPaymentMethod, historyPerson, historySearch, historyType, monthOperations, reviewMap, selectedMonth, showReviewOnly, today]);`,
            `reviewMap, selectedMonth, showReviewOnly, today]);`,
          );

          app = app.replace(`                  <option value="reimbursement">Remboursement</option>\n`, '');

          app = replaceOrVerify(
            app,
            `<OperationForm editingId={editingId} onSubmit={handleSubmit} onCancel={cancelOperationDraft} isValid={operationDraftIsValid} status={operationStatus}>`,
            `<OperationForm editingId={editingId} operationType={draft.type} onSubmit={handleSubmit} onCancel={cancelOperationDraft} isValid={operationDraftIsValid} status={operationStatus}>`,
            `operationType={draft.type}`,
          );

          app = app.replace(
            `  const startCareReimbursement = (person) => { setDraft({ ...makeEmptyOperation(), type: 'reimbursement', category: 'divers', person, paymentMethod: 'Espèces', store: '', label: \`Remboursement \${person}\` }); setEditingId(null); setOperationStatus('Remboursement : choisis Compte Belfius s’il est bancaire ou Espèces s’il est remis en cash.'); setActiveView('add'); };\n\n`,
            '',
          );

          app = app.replace(
            `<button type="button" className="secondary-button care-recovery-button" onClick={() => startCareReimbursement(item.person)}>Remboursement</button>`,
            `<span className="hint">Remboursement historique uniquement</span>`,
          );

          if (app.includes('<option value="reimbursement">Remboursement</option>')) {
            throw new Error('Obsolete reimbursement option is still exposed');
          }
          if (app.includes('startCareReimbursement(')) {
            throw new Error('Obsolete reimbursement creation shortcut is still exposed');
          }
          if (!app.includes(`operationType={draft.type}`)) {
            throw new Error('OperationForm refund validation wiring missing');
          }
          fs.writeFileSync(appPath, app);

          const formPath = 'src/features/operations/OperationForm.jsx';
          let form = fs.readFileSync(formPath, 'utf8');
          form = replaceOrVerify(
            form,
            `  editingId,\n  onSubmit,`,
            `  editingId,\n  operationType,\n  onSubmit,`,
            `  operationType,`,
          );
          form = replaceOrVerify(
            form,
            `}) {\n  return (`,
            `}) {\n  const obsoleteRefundDraft = !editingId && operationType === 'reimbursement';\n  const handleSubmit = (event) => {\n    if (obsoleteRefundDraft) {\n      event.preventDefault();\n      return;\n    }\n    onSubmit(event);\n  };\n\n  return (`,
            `const obsoleteRefundDraft = !editingId && operationType === 'reimbursement';`,
          );
          form = replaceOrVerify(
            form,
            `<form className="panel form-panel" onSubmit={onSubmit}>`,
            `<form className="panel form-panel" onSubmit={handleSubmit}>`,
            `onSubmit={handleSubmit}`,
          );
          form = replaceOrVerify(
            form,
            `<button className="primary-button" type="submit" disabled={!isValid}>`,
            `<button className="primary-button" type="submit" disabled={!isValid || obsoleteRefundDraft}>`,
            `disabled={!isValid || obsoleteRefundDraft}`,
          );
          form = replaceOrVerify(
            form,
            `        {!isValid && <p className="hint status-error" role="alert">Renseigne un libellé et un montant supérieur à zéro.</p>}\n`,
            `        {obsoleteRefundDraft && <p className="hint status-error" role="alert">La création de nouveaux remboursements n’est plus autorisée.</p>}\n        {!isValid && <p className="hint status-error" role="alert">Renseigne un libellé et un montant supérieur à zéro.</p>}\n`,
            `La création de nouveaux remboursements n’est plus autorisée.`,
          );
          fs.writeFileSync(formPath, form);
          EOF
      - run: npm ci
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
      - name: Commit correction if needed
        run: |
          if git diff --quiet -- src/App.jsx src/features/operations/OperationForm.jsx; then
            echo "No correction changes to commit."
            exit 0
          fi
          git config user.name "ChatGPT Codex Connector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/features/operations/OperationForm.jsx
          git commit -m "fix: resolve history date filtering and adjust refund validation"
          git push origin architecture/extract-form
