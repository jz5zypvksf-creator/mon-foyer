name: Verify architecture extract form
on:
  push:
    branches: [architecture/extract-form]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: architecture/extract-form
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply structural refund and history repair
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';

          const appPath = 'src/App.jsx';
          let app = fs.readFileSync(appPath, 'utf8');

          const replaceOrVerify = (source, before, after, marker = after) => {
            if (source.includes(after)) return source;
            if (source.includes(before)) return source.replace(before, after);
            if (source.includes(marker)) return source;
            throw new Error(`Patch anchor missing: ${before.slice(0, 90)}`);
          };

          // 1) Historique du mois courant: ne montrer que les écritures arrivées à échéance.
          app = replaceOrVerify(
            app,
            `    // L'Historique est le registre des écritures sauvegardées pour le mois choisi.\n    // Une écriture future reste visible et est distinguée comme « Prévue » dans la liste.\n    return monthOperations.filter((operation) => {`,
            `    // Pour le mois en cours, l'historique ne reprend que les écritures arrivées à échéance.\n    // Les écritures futures restent disponibles dans les vues prévisionnelles.\n    return monthOperations.filter((operation) => {\n      if (selectedMonth === today.slice(0, 7) && operation.date > today) return false;`,
            `if (selectedMonth === today.slice(0, 7) && operation.date > today) return false;`,
          );

          app = replaceOrVerify(
            app,
            `  }, [data.categories, historyCategory, historyPaymentMethod, historyPerson, historySearch, historyType, monthOperations, reviewMap, showReviewOnly]);`,
            `  }, [data.categories, historyCategory, historyPaymentMethod, historyPerson, historySearch, historyType, monthOperations, reviewMap, selectedMonth, showReviewOnly, today]);`,
            `reviewMap, selectedMonth, showReviewOnly, today]);`,
          );

          // 2) Remboursement doit rester créable et filtrable.
          if (!app.includes(`<option value="reimbursement">Remboursement</option>`)) {
            throw new Error('Refund option missing from operation type selector');
          }
          if (!app.includes(`type: 'reimbursement'`) || !app.includes('startCareReimbursement')) {
            throw new Error('Refund creation shortcut/state is missing');
          }
          if (!app.includes(`historyType !== 'all'`) || !app.includes(`operation.type !== historyType`)) {
            throw new Error('Generic history type filter is missing');
          }

          app = replaceOrVerify(
            app,
            `<OperationForm editingId={editingId} onSubmit={handleSubmit} onCancel={cancelOperationDraft} isValid={operationDraftIsValid} status={operationStatus}>`,
            `<OperationForm editingId={editingId} operationType={draft.type} onSubmit={handleSubmit} onCancel={cancelOperationDraft} isValid={operationDraftIsValid} status={operationStatus}>`,
            `operationType={draft.type}`,
          );

          fs.writeFileSync(appPath, app);

          const formPath = 'src/features/operations/OperationForm.jsx';
          let form = fs.readFileSync(formPath, 'utf8');

          form = replaceOrVerify(
            form,
            `  editingId,\n  onSubmit,`,
            `  editingId,\n  operationType,\n  onSubmit,`,
            `  operationType,`,
          );

          // Supprime toute ancienne logique qui considérait reimbursement comme obsolète.
          form = form.replace(/\n  const obsoleteRefundDraft = !editingId && operationType === 'reimbursement';[\s\S]*?\n  return \(/, '\n  return (');
          form = form.replace('onSubmit={handleSubmit}', 'onSubmit={onSubmit}');
          form = form.replace('disabled={!isValid || obsoleteRefundDraft}', 'disabled={!isValid}');
          form = form.replace(/\n        \{obsoleteRefundDraft && <p className="hint status-error" role="alert">[^<]*<\/p>\}/, '');

          form = replaceOrVerify(
            form,
            `<form className="panel form-panel" onSubmit={onSubmit}>`,
            `<form className="panel form-panel" data-operation-type={operationType || undefined} onSubmit={onSubmit}>`,
            `data-operation-type={operationType || undefined}`,
          );

          if (form.includes('obsoleteRefundDraft') || form.includes('La création de nouveaux remboursements n’est plus autorisée')) {
            throw new Error('Refund blocking logic still present in OperationForm');
          }

          fs.writeFileSync(formPath, form);
          EOF
      - run: npm ci
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
      - name: Commit structural repair
        run: |
          if git diff --quiet -- src/App.jsx src/features/operations/OperationForm.jsx; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "ChatGPT Codex Connector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/features/operations/OperationForm.jsx
          git commit -m "fix: structural repair for operation form with complete refund and date features"
          git push origin architecture/extract-form
