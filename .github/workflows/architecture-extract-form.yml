name: Verify architecture extract form
on:
  push:
    branches: [architecture/extract-form]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: architecture/extract-form
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
