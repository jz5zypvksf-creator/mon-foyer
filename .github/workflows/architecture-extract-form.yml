name: Verify architecture extract form
on:
  push:
    branches: [architecture/extract-form]
    paths: ['scripts/apply-extract-form.mjs']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: architecture/extract-form
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Wire OperationForm
        run: node scripts/apply-extract-form.mjs
      - name: Commit wiring
        run: |
          git config user.name "ChatGPT Codex Connector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "arch: wire OperationForm and draft hook"
          git push origin architecture/extract-form
      - run: npm ci
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
