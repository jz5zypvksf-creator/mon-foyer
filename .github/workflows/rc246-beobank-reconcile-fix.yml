name: RC2.4.6 Beobank reconciliation fix

on:
  push:
    branches: [v32-rc2-4-6]
    paths:
      - '.github/workflows/rc246-beobank-reconcile-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v32-rc2-4-6
      - name: Patch Belfius reconciliation rules
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Verify build
        run: npm install && npm run build
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/BelfiusAudit.jsx package-lock.json
          git commit -m "RC2.4.6: make Beobank savings exclusive and validation effective"
          git push origin HEAD:v32-rc2-4-6
