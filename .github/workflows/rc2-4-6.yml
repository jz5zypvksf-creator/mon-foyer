name: RC2.4.6 apprentissage Belfius et epargne

on:
  push:
    branches:
      - v32-rc2-4-6
    paths:
      - scripts/apply-rc2-4-6.mjs
      - .github/workflows/rc2-4-6.yml

permissions:
  contents: write

jobs:
  apply-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v32-rc2-4-6
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/apply-rc2-4-6.mjs
      - run: npm install
      - run: npm run build
      - name: Commit RC2.4.6
        run: |
          git config user.name "ChatGPT Codex Connector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/BelfiusAudit.jsx src/styles.css
          if git diff --cached --quiet; then
            echo "Aucun changement à committer"
          else
            git commit -m "V32 RC2.4.6 - Apprentissage Belfius, Beobank et solde reel"
            git push origin v32-rc2-4-6
          fi
