name: Vérifications Mon Foyer

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Configurer Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Installer
        run: npm ci
      - name: Tester
        run: npm test
      - name: Construire
        run: npm run build
