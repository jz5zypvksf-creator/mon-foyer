name: Apply V29

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-v29.mjs'
      - '.github/workflows/apply-v29.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-v29:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply patch
        run: node scripts/apply-v29.mjs

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Commit V29
        run: |
          git config user.name "ChatGPT Codex Connector"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.jsx public/sw.js
          if git diff --cached --quiet; then
            echo "Aucune modification à publier."
          else
            git commit -m "V29 - Sécurise les récurrences et affiche les catégories"
            git push
          fi
