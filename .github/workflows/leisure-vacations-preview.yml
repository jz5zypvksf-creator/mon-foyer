name: Leisure vacations preview

on:
  push:
    branches:
      - dev/loisirs-vacances
    paths-ignore:
      - vite.config.js

permissions:
  contents: write

jobs:
  integrate-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/apply-leisure-integration.mjs
      - run: node scripts/apply-savings-transfer-integration.mjs
      - run: npm install
      - run: npm run build
      - name: Commit integrated Vite config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vite.config.js
          if git diff --cached --quiet; then
            echo "No integration change to commit"
          else
            git commit -m "Intègre la Preview Loisirs/Vacances et transfert épargne"
            git push
          fi
