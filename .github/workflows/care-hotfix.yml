name: Care hotfix

on:
  push:
    branches: [dev/savings-op-controls]
    paths:
      - 'scripts/apply-care-hotfix.mjs'
      - '.github/workflows/care-hotfix.yml'

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/savings-op-controls
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-care-hotfix.mjs
      - run: npm install
      - run: npm run build
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vite.config.js package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Corrige le détail Papa/Nonna et le doublon Taxes d'août"
          git push origin HEAD:dev/savings-op-controls
