name: Verify Beobank build
on:
  push:
    branches: [v32-rc2-4-6]
    paths:
      - '.github/workflows/verify-beobank-build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v32-rc2-4-6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
