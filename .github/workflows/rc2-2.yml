name: RC2.2 audit UX

on:
  push:
    paths:
      - '.github/workflows/rc2-2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v32-sprint-1
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-rc2-2.mjs
      - run: npm install
      - run: npm run build
      - name: Commit RC2.2
        run: |
          git config user.name "ChatGPT Codex Connector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/BelfiusAudit.jsx src/styles.css
          git diff --cached --quiet || git commit -m "V32 RC2.2 - Statuts exclusifs, echeances et UX audit"
          git push origin HEAD:v32-sprint-1
