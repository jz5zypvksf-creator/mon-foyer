name: Dev savings interface

on:
  push:
    branches: [dev/savings-op-controls]
    paths:
      - '.github/workflows/dev-savings-interface.yml'
      - 'src/**'
      - 'vite.config.js'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/savings-op-controls
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build application
        run: npm run build
