name: RC2.4.2 identification Belfius historique

on:
  push:
    paths:
      - '.github/workflows/rc2-4-2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v32-rc2-4-2
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-rc2-4-2.mjs
      - run: npm install
      - run: npm run build
      - name: Commit RC2.4.2
        run: |
          git config user.name "ChatGPT Codex Connector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git diff --cached --quiet || git commit -m "V32 RC2.4.2 - Identification Belfius modifiable depuis historique"
          git push origin HEAD:v32-rc2-4-2
