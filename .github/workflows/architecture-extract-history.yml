name: Finalize architecture extract history

on:
  push:
    branches:
      - architecture/extract-history
    paths:
      - 'scripts/apply-extract-history.mjs'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: architecture/extract-history
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply App.jsx wiring
        run: node scripts/apply-extract-history.mjs
      - name: Install dependencies
        run: npm ci
      - name: Run full test suite
        run: npm run test
      - name: Build production bundle
        run: npm run build
      - name: Commit finalized extraction
        run: |
          git config user.name "ChatGPT Codex Connector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/apply-extract-history.mjs .github/workflows/architecture-extract-history.yml
          git add src/App.jsx scripts/apply-extract-history.mjs .github/workflows/architecture-extract-history.yml
          git commit -m "refactor: finalize operation history extraction"
          git push origin architecture/extract-history
