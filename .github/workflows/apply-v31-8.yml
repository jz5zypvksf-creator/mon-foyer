name: Apply V31.8

on:
  push:
    paths:
      - 'scripts/apply-v31-8-scheduled-operation-types.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/apply-v31-8-scheduled-operation-types.mjs
      - run: npm install
      - run: npm run build
      - name: Commit generated changes
        run: |
          git config user.name "ChatGPT Codex Connector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/styles.css public/sw.js
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "V31.8 - Distingue les opérations programmées"
            git push
          fi
